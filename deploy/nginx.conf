# ─────────────────────────────────────────────────────────────────────────────
# kazan.zabravih.org — nginx site config
#
# Routing:
#   /static/*  → Django static files (direct)
#   /api/*     → Django/gunicorn on 127.0.0.1:8000
#   /admin/*   → Django/gunicorn on 127.0.0.1:8000
#   /*         → Next.js on 127.0.0.1:3000
#
# Deploy:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/zabravih
#   sudo nginx -t && sudo systemctl reload nginx
# ─────────────────────────────────────────────────────────────────────────────

# Drop all requests that don't match a known server_name (security)
server {
    listen 127.0.0.1:80 default_server;
    listen 127.0.0.1:443 ssl default_server;
    server_name _;
    ssl_certificate     /etc/ssl/certs/cloudflare_origin.pem;
    ssl_certificate_key /etc/ssl/private/cloudflare_origin.key;
    return 444;
}

server {
    listen 127.0.0.1:80;
    server_name kazan.zabravih.org;
    return 301 https://$host$request_uri;
}

server {
    listen 127.0.0.1:443 ssl http2;
    server_name kazan.zabravih.org;

    ssl_certificate     /etc/ssl/certs/cloudflare_origin.pem;
    ssl_certificate_key /etc/ssl/private/cloudflare_origin.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    real_ip_header CF-Connecting-IP;
    set_real_ip_from 127.0.0.1;

    client_max_body_size 100M;

    # ── Django static files ───────────────────────────────────────────────
    location /static/ {
        alias /home/main/rose-valley-Zabravih/py/garbageCollection/static/;
        try_files $uri $uri/ =404;
    }

    # Redirect /api/... without trailing slash (preserves POST method)
    location ~ ^/api/[^/]+$ {
        return 308 $uri/;
    }

    # ── Django pitch page ─────────────────────────────────────────────────
    location /pitch/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # ── Django REST API ───────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ── Django admin ──────────────────────────────────────────────────────
    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # ── Next.js frontend (everything else) ────────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
