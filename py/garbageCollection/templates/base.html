{% load tz %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Smart Bin Monitor{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #0f1117;
            --bg-card: #1a1d27;
            --bg-card-hover: #212435;
            --bg-nav: #13151f;
            --border-color: rgba(255,255,255,0.07);
            --text-primary: #e8eaf0;
            --text-muted: #7b8299;
            --accent-blue: #4f8ef7;
            --accent-red: #f05252;
            --accent-yellow: #f5a623;
            --accent-green: #34c472;
            --accent-cyan: #22d3ee;
            --shadow-card: 0 4px 24px rgba(0,0,0,0.35);
        }

        *, *::before, *::after { box-sizing: border-box; }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg-body);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ── Navbar ── */
        .app-navbar {
            background: var(--bg-nav);
            border-bottom: 1px solid var(--border-color);
            padding: 0.75rem 1.25rem;
            position: sticky;
            top: 0;
            z-index: 1030;
            backdrop-filter: blur(12px);
        }
        .navbar-brand-wrap {
            display: flex;
            align-items: center;
            gap: 0.65rem;
            text-decoration: none;
        }
        .brand-icon {
            width: 34px;
            height: 34px;
            background: linear-gradient(135deg, var(--accent-blue), #7c3aed);
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            color: #fff;
            flex-shrink: 0;
        }
        .brand-text {
            font-weight: 700;
            font-size: 1rem;
            color: var(--text-primary);
            letter-spacing: -0.01em;
        }
        .brand-sub {
            font-size: 0.7rem;
            color: var(--text-muted);
            font-weight: 400;
        }

        /* ── Main layout ── */
        .app-main {
            flex: 1;
            padding: 1.5rem;
        }
        @media (max-width: 576px) {
            .app-main { padding: 1rem 0.75rem; }
        }

        /* ── Footer ── */
        .app-footer {
            background: var(--bg-nav);
            border-top: 1px solid var(--border-color);
            padding: 0.75rem 1.25rem;
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        /* ── Cards ── */
        .dark-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            box-shadow: var(--shadow-card);
            transition: background 0.2s, transform 0.2s;
        }
        .dark-card:hover {
            background: var(--bg-card-hover);
            transform: translateY(-2px);
        }

        /* ── Scrollbar ── */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav class="app-navbar">
        <div class="d-flex align-items-center justify-content-between">
            <a class="navbar-brand-wrap" href="{% url 'garbageData:home' %}">
                <span class="brand-icon"><i class="fas fa-trash-alt"></i></span>
                <div>
                    <div class="brand-text">SmartBin Monitor</div>
                    <div class="brand-sub">Garbage Collection System</div>
                </div>
            </a>
            <div class="d-flex align-items-center gap-2">
                <a href="{% url 'garbageData:pitch' %}" style="
                    display:inline-flex;align-items:center;gap:0.4rem;
                    background:linear-gradient(135deg,#028090,#02C39A);
                    color:#fff;font-family:'Syne',sans-serif;font-weight:700;
                    font-size:0.75rem;padding:0.35rem 0.85rem;border-radius:7px;
                    text-decoration:none;letter-spacing:0.02em;
                    transition:opacity 0.2s,transform 0.2s;
                " onmouseover="this.style.opacity='0.85';this.style.transform='translateY(-1px)'"
                   onmouseout="this.style.opacity='1';this.style.transform='none'">
                    <i class="fas fa-chart-line"></i> Pitch
                </a>
                <span class="badge rounded-pill" style="background:rgba(52,196,114,0.15);color:var(--accent-green);font-size:0.7rem;padding:0.35em 0.7em;">
                    <i class="fas fa-circle" style="font-size:0.5rem;vertical-align:middle;margin-right:3px;"></i>Live
                </span>
            </div>
        </div>
    </nav>

    <main class="app-main">
        {% block content %}{% endblock %}
    </main>

    <footer class="app-footer">
        SmartBin Monitor &mdash; Rose Valley Zabravih
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
